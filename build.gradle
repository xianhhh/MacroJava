plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.0.0'
}

group = 'io.github.xianhhh'
version = '2.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.ow2.asm:asm:9.11.1'
    implementation 'org.ow2.asm:asm-tree:9.11.1'
    implementation 'org.ow2.asm:asm-analysis:9.11.1'
    implementation gradleApi()
}

gradlePlugin {
    website = "https://github.com/xianhhh/MacroJava"
    vcsUrl = "https://github.com/xianhhh/MacroJava.git"
    plugins {
        register('macroJava') {
            id = 'io.github.xianhhh.macrojava'
            implementationClass = 'xh.xianhhh.gradle.MacroJavaPlugin'
            displayName = 'MacroJava'
            description = 'Post-compile Java macros and constant inlining'
            tags.set(['java', 'bytecode', 'compile-time', 'optimization'])
        }
    }
}

tasks.register('verifyMacroJava', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('xh.xianhhh.asm.ConstExprTransformerTest')
}

tasks.register('benchmarkMacroJava', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('xh.xianhhh.asm.ConstExprArrayBenchmark')
}

tasks.named('check') { dependsOn tasks.named('verifyMacroJava') }
