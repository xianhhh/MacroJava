plugins {
    id 'java'
    id 'application'
    id 'io.github.xianhhh.macrojava' version '2.0.0'
}

group = 'io.github.xianhhh'
version = '1.0.0'

repositories {
    mavenCentral()
}

import xh.xianhhh.macro.ConstExprMode

macroJava {
    mode = ConstExprMode.TAG
    checkLegit = false
    showProgress = false
}

application {
    mainClass = 'xh.xianhhh.Main'
}

tasks.register('verifyRuntime', JavaExec) {
    group = 'verification'
    description = 'Runs the independent ConstExpr runtime verification.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
}

tasks.named('check') {
    dependsOn tasks.named('verifyRuntime')
}
